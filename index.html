
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Palace AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;600&family=Source+Code+Pro&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #050505;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-mono { font-family: 'Source Code Pro', monospace; }
    .poker-felt {
      background: radial-gradient(circle at center, #064e3b 0%, #022c22 100%);
      box-shadow: inset 0 0 150px rgba(0,0,0,0.8);
    }
    .card-shadow {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
    }
    
    @keyframes deal-flick {
      0% { transform: translateY(-120vh) rotateX(60deg) rotateZ(45deg) scale(0.5); opacity: 0; }
      70% { transform: translateY(15px) rotateX(0) rotateZ(-10deg) scale(1.05); opacity: 1; }
      100% { transform: translateY(0) rotateX(0) rotateZ(0) scale(1); opacity: 1; }
    }
    .animate-deal { animation: deal-flick 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards; }

    @keyframes muck-fold {
      0% { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; filter: blur(0); }
      100% { transform: translate(0, -200px) rotate(90deg) scale(0.4); opacity: 0; filter: blur(4px); }
    }
    .animate-muck { animation: muck-fold 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards; }

    @keyframes chip-toss {
      0% { transform: scale(0.5) translateY(20px); opacity: 0; }
      20% { opacity: 1; }
      80% { transform: scale(1.1) translateY(-60px); opacity: 1; }
      100% { transform: scale(1) translateY(-100px); opacity: 0; }
    }
    .animate-chip-toss { animation: chip-toss 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .animate-shimmer { animation: shimmer 2.5s infinite linear; }

    @keyframes action-pop {
      0% { transform: scale(0.5) translateY(10px); opacity: 0; }
      70% { transform: scale(1.1) translateY(-5px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .animate-pop { animation: action-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

    .card-container { perspective: 1200px; }
    .card-hover:hover { transform: translateY(-10px) rotateY(10deg) scale(1.05); z-index: 50; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react/": "https://esm.sh/react@^19.2.3/",
      "react": "https://esm.sh/react@^19.2.3",
      "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
      "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
